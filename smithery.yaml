startCommand:
  type: http
  url: https://mcp-server-splitmygear.vercel.app/api/mcp
  headers:
    - name: Content-Type
      value: application/json
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: "Optional operator API key (sent as x-api-key) for the public search/pricing tools. Leave empty to sign in with your Splitt account via OAuth 2.1, which unlocks the renter and vendor tools."
    required: []
  configHeadersFunction: |
    (config) => {
      const headers = {};
      if (config.apiKey) {
        headers['x-api-key'] = config.apiKey;
      }
      return headers;
    }
