startCommand:
  type: http
  url: https://mcp-server-splitmygear.vercel.app/api/mcp
  headers:
    - name: Content-Type
      value: application/json
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: "Required SplitMyGear API key (x-api-key). Authentication is mandatory — there is no public tier. A user JWT may be supplied instead for user-scoped tools."
    required: []
  configHeadersFunction: |
    (config) => {
      const headers = {};
      if (config.apiKey) {
        headers['x-api-key'] = config.apiKey;
      }
      return headers;
    }
