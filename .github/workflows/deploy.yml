# Primary deploy path: Vercel Git integration auto-deploys every push to `main`
# for this project (prj_TDhBx521A191W9r43oVhwJrBCXxv) directly, with no Actions
# involvement. This workflow is a manual fallback only, kept in case
# VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets are ever provisioned
# in this repo. Made workflow_dispatch-only 2026-08-28 per the SPLIT-670
# consolidation pattern (BE/FE/CRM deploy workflows) after this workflow failed
# on every push since 2026-07-02 at the "Pull Vercel environment" step (those
# secrets were never set here).
name: Deploy to Vercel

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
